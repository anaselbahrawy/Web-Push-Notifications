<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Push Notifications Demo</title>
</head>
<body>
  <h1>Web Push Notifications</h1>
  <label>VAPID public key <input id="key" size="90" placeholder="Paste your VAPID_PUBLIC_KEY"></label>
  <p><button id="subscribe">Subscribe</button></p>
  <p>Copy the subscription below into <code>subscription.json</code>, then run <code>npm run send</code>.</p>
  <textarea id="output" rows="8" cols="90" readonly></textarea>

  <script>
    // Converts the base64url VAPID key into the Uint8Array the Push API expects.
    function urlBase64ToUint8Array(base64) {
      const padding = '='.repeat((4 - (base64.length % 4)) % 4);
      const raw = atob((base64 + padding).replace(/-/g, '+').replace(/_/g, '/'));
      return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
    }

    navigator.serviceWorker.register('./sw.js');

    document.getElementById('subscribe').addEventListener('click', async () => {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') return alert('Notification permission denied');

      const registration = await navigator.serviceWorker.ready;
      const subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(document.getElementById('key').value.trim()),
      });
      document.getElementById('output').value = JSON.stringify(subscription, null, 2);
    });
  </script>
</body>
</html>
